<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 便签纸底色：极致经典且高端雅致的渐变淡黄色 (Classic Canary Yellow) -->
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    
    <!-- 卷角背面的立体渐变：模拟黄色纸张翻折的折角金黄暗面与高光 -->
    <linearGradient id="curl-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pill-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- 整体纸张悬浮阴影 -->
    <filter id="paper-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- 掀起弯折角的阴影：创造凌空飞起的感觉 -->
    <filter id="curl-shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- PWA专用图标：不倾斜，左右填满，底部拉高，消除所有白边 -->
  <g>
    
    <!-- 1. 便签纸主体：铺满左、上、右侧，消除除右下卷角外的所有白边与外阴影 -->
    <path 
      d="M0 0 H100 V70 L74 94 H0 Z" 
      fill="url(#paper-bg)" 
    />

    <!-- 2. 3行精美小胶囊清单 -->
    
    <!-- 第一行：洋红胶囊 (未完成方块 + 右侧金黄色小五角星 ⭐️) -->
    <rect x="10" y="24" width="6" height="6" rx="1.5" stroke="#EC4899" stroke-width="1.2" fill="none" />
    <rect x="20" y="24" width="48" height="6" rx="3" fill="#EC4899" />
    <!-- 饱满完美的五角星 ⭐️ (平移至 X 轴 88 附近) -->
    <path 
      d="M88.0 23 L89.6 26.2 L93.1 26.7 L90.5 29.1 L91.1 32.6 L88.0 30.9 L84.9 32.6 L85.5 29.1 L82.9 26.7 L86.4 26.2 Z" 
      fill="#EAB308" 
    />

    <!-- 第二行：极客蓝胶囊 (已完成打勾复选框 + 右侧超圆润小铃铛 🔔) -->
    <rect x="10" y="38" width="6" height="6" rx="1.5" fill="url(#pill-blue)" />
    <path d="M11.5 41 L12.8 42.3 L15 40" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="20" y="38" width="51" height="6" rx="3" fill="url(#pill-blue)" />
    <!-- 饱满立体感的 iOS 风格小铃铛 (平移至 X 轴 88 附近) -->
    <path 
      d="M88.0 34.5 C86.7 34.5 85.7 35.8 85.7 37.2 C85.7 38.2 84.7 40.2 84.0 40.8 C83.5 41.3 83.5 42.2 84.8 42.2 H90.7 C92.0 42.2 92.5 41.3 92.0 40.8 C91.3 40.2 90.3 38.2 90.3 37.2 C90.3 35.8 89.3 34.5 88.0 34.5 Z" 
      fill="url(#pill-blue)" 
    />
    <circle cx="88.0" cy="43.2" r="1.1" fill="url(#pill-blue)" />

    <!-- 第三行：明黄胶囊 (未完成方块) -->
    <rect x="10" y="52" width="6" height="6" rx="1.5" stroke="#F97316" stroke-width="1.2" fill="none" />
    <rect x="20" y="52" width="40" height="6" rx="3" fill="url(#pill-yellow)" />

    <!-- 3. 掀起一角 (立体卷边效果，切至 Y=94) -->
    <path 
      d="M74 94 C74 82 82 70 98 70 C82 82 82 94 74 94 Z" 
      fill="url(#curl-bg)" 
      filter="url(#curl-shadow)"
    />
    <path d="M74 94 L98 70" stroke="#EAB308" stroke-opacity="0.3" stroke-width="0.5" />
    
  </g>
</svg>
