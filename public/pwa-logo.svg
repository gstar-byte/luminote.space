<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 便签纸底色：极致经典且高端雅致的渐变淡黄色 (Classic Canary Yellow) -->
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    
    <!-- 卷角背面的立体渐变：模拟黄色纸张翻折的折角金黄暗面与高光 -->
    <linearGradient id="curl-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="pill-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pill-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- 整体纸张悬浮阴影 -->
    <filter id="paper-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- 掀起弯折角的阴影：创造凌空飞起的感觉 -->
    <filter id="curl-shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- PWA专用图标：不倾斜，左右填满，底部拉高，消除所有白边 -->
  <g>
    
    <!-- 1. 便签纸主体：加宽版经典圆角矩形，X 范围 6 到 94，Y 范围 8 到 92 -->
    <path 
      d="M6 20 C6 13.37 13.37 8 20 8 H80 C86.63 8 94 13.37 94 20 V68 L70 92 H20 C13.37 92 6 85.37 6 76 Z" 
      fill="url(#paper-bg)" 
      filter="url(#paper-shadow)"
    />

    <!-- 2. 3行精美小胶囊清单 (向左平移 10px，增加 12-15px 宽度，右侧图标对应右移 6.5px) -->
    
    <!-- 第一行：洋红胶囊 (未完成方块 + 右侧金黄色小五角星 ⭐️) -->
    <rect x="15" y="28" width="6" height="6" rx="1.5" stroke="#EC4899" stroke-width="1.2" fill="none" />
    <rect x="25" y="28" width="38" height="6" rx="3" fill="#EC4899" />
    <!-- 饱满完美的五角星 ⭐️ (平移至 X 轴 82 附近) -->
    <path 
      d="M82.0 27 L83.6 30.2 L87.1 30.7 L84.5 33.1 L85.1 36.6 L82.0 34.9 L78.9 36.6 L79.5 33.1 L76.9 30.7 L80.4 30.2 Z" 
      fill="#EAB308" 
    />

    <!-- 第二行：极客蓝胶囊 (已完成打勾复选框 + 右侧超圆润小铃铛 🔔) -->
    <rect x="15" y="42" width="6" height="6" rx="1.5" fill="url(#pill-blue)" />
    <path d="M16.5 45 L17.8 46.3 L20 44" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25" y="42" width="41" height="6" rx="3" fill="url(#pill-blue)" />
    <!-- 饱满立体感的 iOS 风格小铃铛 (平移至 X 轴 82 附近) -->
    <path 
      d="M82.0 38.5 C80.7 38.5 79.7 39.8 79.7 41.2 C79.7 42.2 78.7 44.2 78.0 44.8 C77.5 45.3 77.5 46.2 78.8 46.2 H84.7 C86.0 46.2 86.5 45.3 86.0 44.8 C85.3 44.2 84.3 42.2 84.3 41.2 C84.3 39.8 83.3 38.5 82.0 38.5 Z" 
      fill="url(#pill-blue)" 
    />
    <circle cx="82.0" cy="47.2" r="1.1" fill="url(#pill-blue)" />

    <!-- 第三行：明黄胶囊 (未完成方块) -->
    <rect x="15" y="56" width="6" height="6" rx="1.5" stroke="#F97316" stroke-width="1.2" fill="none" />
    <rect x="25" y="56" width="30" height="6" rx="3" fill="url(#pill-yellow)" />

    <!-- 3. 掀起一角 (立体卷边效果，切至 Y=92) -->
    <path 
      d="M70 92 C70 80 80 68 94 68 C80 80 80 92 70 92 Z" 
      fill="url(#curl-bg)" 
      filter="url(#curl-shadow)"
    />
    <path d="M70 92 L94 68" stroke="#EAB308" stroke-opacity="0.3" stroke-width="0.5" />
    
  </g>
</svg>
