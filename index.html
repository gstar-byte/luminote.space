    <!-- Splash screen styles (in head so they apply immediately) -->
    <style>
      html, body { margin: 0; padding: 0; }
      #lumi-splash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8F9FA;
        z-index: 99999;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.35s ease;
      }
      #lumi-splash.fade-out { opacity: 0; }
      .lumi-splash-logo {
        width: 160px; height: 160px;
        animation: lumi-pulse 2.4s ease-in-out infinite;
      }
      .lumi-splash-text {
        font-size: 20px; font-weight: 800; letter-spacing: -0.3px;
        color: #1D1D1F;
        margin-top: 4px;
      }
      .lumi-splash-bar {
        width: 160px; height: 3px; border-radius: 2px; overflow: hidden;
        background: rgba(0,0,0,0.08);
      }
      .lumi-splash-bar-inner {
        width: 40%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, #007AFF, #00C6FF);
        animation: lumi-slide 1.2s ease-in-out infinite;
      }
      @keyframes lumi-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
      @keyframes lumi-slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    </style>
  </head>
  <body>
    <!-- Splash — sibling of #root, removed by script after React mounts -->
    <div id="lumi-splash">
      <!-- AppLogo SVG (sticky note with colorful pills) -->
      <svg class="lumi-splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
        <defs>
          <linearGradient id="sp-paper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF0"/>
            <stop offset="100%" stop-color="#FEF08A"/>
          </linearGradient>
          <linearGradient id="sp-curl" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#EAB308"/>
            <stop offset="40%" stop-color="#FEF08A"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
          </linearGradient>
          <linearGradient id="sp-blue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#2563EB"/>
          </linearGradient>
          <linearGradient id="sp-orange" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F97316"/>
            <stop offset="100%" stop-color="#FACC15"/>
          </linearGradient>
          <filter id="sp-shadow" x="-20%" y="-20%" width="145%" height="145%">
            <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#000" flood-opacity="0.13"/>
          </filter>
          <filter id="sp-curl-sh" x="-35%" y="-35%" width="170%" height="170%">
            <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
          </filter>
        </defs>
        <rect width="100" height="100" rx="20" ry="20" fill="#FFFDF0" />
        <g transform="rotate(-26, 50, 50)">
          <!-- Paper body -->
          <path d="M18 30 C18 23.3726 23.3726 18 30 18 H70 C76.6274 18 82 23.3726 82 30 V60 L60 82 H30 C23.3726 82 18 76.6274 18 70 Z" fill="url(#sp-paper)" filter="url(#sp-shadow)"/>
          <!-- Row 1: pink checkbox + pink pill + star -->
          <rect x="25" y="28" width="6" height="6" rx="1.5" stroke="#EC4899" stroke-width="1.2" fill="none"/>
          <rect x="35" y="28" width="28" height="6" rx="3" fill="#EC4899"/>
          <path d="M75.5 27 L77.1 30.2 L80.6 30.7 L78 33.1 L78.6 36.6 L75.5 34.9 L72.4 36.6 L73 33.1 L70.4 30.7 L73.9 30.2 Z" fill="#EAB308"/>
          <!-- Row 2: blue checked checkbox + blue pill + bell -->
          <rect x="25" y="42" width="6" height="6" rx="1.5" fill="url(#sp-blue)"/>
          <path d="M26.5 45 L27.8 46.3 L30 44" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="35" y="42" width="31" height="6" rx="3" fill="url(#sp-blue)"/>
          <path d="M75.5 38.5 C74.2 38.5 73.2 39.8 73.2 41.2 C73.2 42.2 72.2 44.2 71.5 44.8 C71 45.3 71.5 46.2 72.8 46.2 H78.2 C79.5 46.2 80 45.3 79.5 44.8 C78.8 44.2 77.8 42.2 77.8 41.2 C77.8 39.8 76.8 38.5 75.5 38.5 Z" fill="url(#sp-blue)"/>
          <circle cx="75.5" cy="47.2" r="1.1" fill="url(#sp-blue)"/>
          <!-- Row 3: orange checkbox + orange pill -->
          <rect x="25" y="56" width="6" height="6" rx="1.5" stroke="#F97316" stroke-width="1.2" fill="none"/>
          <rect x="35" y="56" width="20" height="6" rx="3" fill="url(#sp-orange)"/>
          <!-- Red pushpin 📌 (aligned with row 3 orange pill) -->
          <g transform="translate(68, 57) rotate(45)">
            <path d="M0 0 L0 4.2" stroke="#94A3B8" stroke-width="1.0" stroke-linecap="round" />
            <ellipse cx="0" cy="0" rx="1.8" ry="0.6" fill="#B91C1C" />
            <path d="M-1.4 0 L-0.9 -2 L0.9 -2 L1.4 0 Z" fill="#EF4444" />
            <circle cx="0" cy="-3.6" r="2.5" fill="#EF4444" />
            <circle cx="-0.8" cy="-4.4" r="0.7" fill="#FFFFFF" opacity="0.75" />
          </g>
          <!-- Curl corner -->
          <path d="M60 82 C60 71 71 60 82 60 C71 71 71 82 60 82 Z" fill="url(#sp-curl)" filter="url(#sp-curl-sh)"/>
          <path d="M60 82 L82 60" stroke="#EAB308" stroke-opacity="0.3" stroke-width="0.5"/>
        </g>
      </svg>
      <span class="lumi-splash-text">Lumi Note</span>
      <div class="lumi-splash-bar"><div class="lumi-splash-bar-inner"></div></div>
    </div>

    <div id="root"></div>
    <script data-cfasync="false" type="module" src="/src/main.tsx?v=4"></script>

    <!-- Remove splash after React first paint -->
    <script>
      (function() {
        var removed = false;
        function removeSplash() {
          if (removed) return;
          removed = true;
          var s = document.getElementById('lumi-splash');
          if (!s) return;
          s.classList.add('fade-out');
          setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 380);
        }
        // Remove as soon as React renders something into #root
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            setTimeout(removeSplash, 80);
          }
        });
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: false });
        // Fallback: remove after 3s regardless
        setTimeout(removeSplash, 3000);
      })();
    </script>
  </body>
</html>
