name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Node Modules
        run: |
          cd mobile
          npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild (Regenerate native assets - icons, splash)
        run: |
          cd mobile
          npx expo prebuild --platform android

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: -Xmx4096m -XX:MaxMetaspaceSize=1024m
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
